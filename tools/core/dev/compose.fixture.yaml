name: lsoverlay-core-dev
services:
  fixture:
    image: lsoverlay/core-fixture:m2-contract-v1
    build:
      context: .
      dockerfile: Dockerfile.fixture
      network: none
    entrypoint: ["dotnet", "/core-fixture/LSOverlay.CoreFixtureHost.dll", "--m2-contract-fixture"]
    user: "1000:1000"
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DOTNET_EnableDiagnostics: "0"
      CORE_FIXTURE_ORIGIN: http://127.0.0.1:15188
    # Internal-only network: no published port or external route.
    # The SSH helper discovers this container's IP on every invocation.
    networks: [isolated]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  isolated:
    internal: true
